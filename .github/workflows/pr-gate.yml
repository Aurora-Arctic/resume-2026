name: PR Gate

# Runs on every pull request targeting `main`, `staging`, or `release/*`. Fans
# out to the blocking checks (lint, format, typecheck, vitest, build,
# Playwright, gitflow) plus a non-blocking npm audit, gating the PR before it
# can be merged. format and gitflow always run; the rest are path-filtered by
# the `changes` job below so a PR only pays for the checks its changed files
# could actually affect.
#
# lint/typecheck/vitest/build/playwright/build-image/format/gitflow are all
# required status checks in branch protection (as "<job> / <job>", the name
# GitHub gives a job inside a called reusable workflow) and required for the
# merge queue too — audit is deliberately not among them; it's PR-only and
# never gates a merge (see the audit job below). Filtering must therefore
# never skip the calling job itself for those seven — a job-level `if:`
# makes GitHub report the check under a different, bare name ("lint" instead
# of "lint / lint") instead of not reporting it at all, and that bare name
# never satisfies the "lint / lint" required check, permanently blocking
# the PR. So those jobs (audit included, for the same consistent-naming
# reason even though it isn't required) always run and instead pass their
# filter result through as a `should-run` workflow_call input — see e.g.
# lint.yml — which skips the actual work internally but keeps the job (and
# its check name) the same either way.
#
# `edited` (in addition to the default opened/synchronize/reopened) is
# included so retargeting a PR's base branch re-triggers gitflow's
# source->target validation even without a new push.
#
# build/format/lint/playwright/typecheck/vitest also `needs: gitflow`, so a
# PR from the wrong source/target branch never burns CI time on them — if
# gitflow fails, GitHub skips those jobs outright (reported under a bare,
# non-qualified name rather than "<job> / <job>"). That's a deliberate
# trade-off, unlike the should-run pattern used for path-filtering above:
# fixing a target-branch mismatch by retargeting the PR's base re-triggers
# this whole workflow on the same PR via `edited` above, so the stuck bare-
# named check from the failed run is superseded by a fresh, correctly-named
# one. Fixing a source-branch-name mismatch generally requires a new PR
# anyway (GitHub PRs can't be repointed to a different head branch), so it
# isn't a regression this gating introduces.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - staging
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  # Determines which downstream checks a given push actually needs to run,
  # so e.g. a docs-only edit doesn't pay for lint/typecheck/vitest/build/
  # playwright/audit. format is deliberately NOT gated by this — Prettier
  # covers .md/.json too, and "did formatting change" is cheap and universal
  # enough that it should just run on every push rather than be filtered.
  # Each filter also matches its own reusable workflow file plus
  # .github/workflows/pr-gate.yml and .github/actions/**, so editing the
  # check's own workflow (or a shared composite action it depends on) always
  # reruns it rather than silently going unverified.
  changes:
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      typecheck: ${{ steps.filter.outputs.typecheck }}
      vitest: ${{ steps.filter.outputs.vitest }}
      build: ${{ steps.filter.outputs.build }}
      playwright: ${{ steps.filter.outputs.playwright }}
      audit: ${{ steps.filter.outputs.audit }}
    steps:
      - name: Determine changed-file categories
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/pr-gate.yml'
              - '.github/actions/**'
            lint:
              - *shared
              - '.github/workflows/lint.yml'
              - '.oxlintrc.json'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - 'package.json'
              - 'package-lock.json'
            typecheck:
              - *shared
              - '.github/workflows/typecheck.yml'
              - '**/*.ts'
              - '**/*.tsx'
              - 'tsconfig.json'
              - 'package-lock.json'
            vitest:
              - *shared
              - '.github/workflows/vitest.yml'
              - 'src/**'
              - 'vitest.config.ts'
              - 'package-lock.json'
            build: &build
              - *shared
              - '.github/workflows/build.yml'
              - 'src/**'
              - 'static/**'
              - 'gatsby-config.ts'
              - 'gatsby-node.ts'
              - 'gatsby-ssr.ts'
              - 'gatsby-browser.ts'
              - 'tsconfig.json'
              - 'package.json'
              - 'package-lock.json'
            playwright:
              - *build
              - '.github/workflows/playwright.yml'
              - 'e2e/**'
              - 'playwright.config.ts'
            audit:
              - *shared
              - '.github/workflows/audit.yml'
              - 'package.json'
              - 'package-lock.json'

  # build-image pushes to a shared, content-addressed GHCR tag and GHA layer
  # cache (cache-to: type=gha,mode=max) keyed off Dockerfile.node +
  # package-lock.json. Cancelling it mid-push can freeze a half-written layer
  # (e.g. an optional native binding download cut short) into that cache/tag,
  # which every later run with the same Dockerfile/lockfile hash would then
  # keep reusing — a corruption that doesn't self-heal on retry. So
  # cancel-in-progress is false here: a superseded run's build-image queues
  # behind the one in flight instead of being killed (avoiding corruption) or
  # left to race it in parallel (avoiding wasted/racy duplicate pushes to the
  # same tag). The jobs below are cheap to rerun and don't share mutable
  # state, so they get their own cancellable concurrency groups instead.
  # Always runs unconditionally (not gated on `changes`) since format always
  # needs its image output regardless of what changed.
  build-image:
    concurrency:
      group: pr-gate-build-image-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/build-image.yml

  lint:
    needs: [build-image, changes, gitflow]
    concurrency:
      group: pr-gate-lint-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/lint.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
      # No job-level `if:` here on purpose — see lint.yml's should-run input for why.
      should-run: ${{ needs.changes.outputs.lint == 'true' }}

  # Deliberately ungated on `changes` — runs on every push regardless of what
  # changed, but still gated on gitflow below.
  format:
    needs: [build-image, gitflow]
    concurrency:
      group: pr-gate-format-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/format.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}

  typecheck:
    needs: [build-image, changes, gitflow]
    concurrency:
      group: pr-gate-typecheck-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/typecheck.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
      # No job-level `if:` here on purpose — see typecheck.yml's should-run input for why.
      should-run: ${{ needs.changes.outputs.typecheck == 'true' }}

  vitest:
    needs: [build-image, changes, gitflow]
    concurrency:
      group: pr-gate-vitest-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/vitest.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
      # No job-level `if:` here on purpose — see vitest.yml's should-run input for why.
      should-run: ${{ needs.changes.outputs.vitest == 'true' }}

  build:
    needs: [build-image, changes, gitflow]
    concurrency:
      group: pr-gate-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/build.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      # No job-level `if:` here on purpose — see build.yml's should-run input for why.
      should-run: ${{ needs.changes.outputs.build == 'true' }}

  playwright:
    needs: [build-image, changes, gitflow]
    concurrency:
      group: pr-gate-playwright-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/playwright.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
      # No job-level `if:` here on purpose — see playwright.yml's should-run input for why.
      should-run: ${{ needs.changes.outputs.playwright == 'true' }}

  # Deliberately ungated — runs on every push regardless of what changed, and
  # doesn't need build-image since it never touches the testing container.
  # merge-queue.yml also calls gitflow.yml, but with should-run: false — see
  # that file for why the actual check only makes sense here, against a
  # PR's real source branch.
  gitflow:
    concurrency:
      group: pr-gate-gitflow-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/gitflow.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}

  # Non-blocking and PR-only — not a required status check, and not called from
  # merge-queue.yml — see .github/workflows/audit.yml.
  audit:
    needs: [build-image, changes]
    concurrency:
      group: pr-gate-audit-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/audit.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ github.event.pull_request.number }}
