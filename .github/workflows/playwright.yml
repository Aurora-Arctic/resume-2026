name: Playwright E2E

# Reusable check that runs the Playwright e2e suite against a built and
# served site. Called via workflow_call from pr-gate and merge-queue,
# never triggered directly.
on:
  workflow_call:
    inputs:
      image:
        description: Testing image ref to run against (from build-image.yml)
        required: true
        type: string
      pr-number:
        description: Pull request number to comment on (omit to skip PR commenting)
        required: false
        type: string
      merge-queue:
        description: Set true when called from merge-queue.yml — uses a separate, merge-queue-labeled comment thread and posts only on failure, instead of always commenting pass/fail
        required: false
        type: boolean
        default: false
      should-run:
        description: >-
          Set false to skip the actual e2e run while still completing this job under
          its normal name. pr-gate passes this from its path-filter output instead of
          putting an `if:` on the calling job — a job-level `if:` makes GitHub report
          a differently-named, bare check run ("playwright" instead of
          "playwright / playwright") when skipped, which never satisfies the
          "playwright / playwright" required status check and leaves the PR stuck.
          Defaults true so merge-queue (no path filtering) is unaffected.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # --ipc=host: Chromium needs more than the container default 64MB /dev/shm,
      # or it crashes. --user root: the image's default user (node, non-root)
      # can't write to the runner's bind-mounted _temp/_runner_file_commands dir,
      # which actions/checkout (and any JS action using core.saveState/setOutput)
      # needs — EACCES otherwise. Running as root means Chromium itself now needs
      # --no-sandbox too — see playwright.config.ts. No HOME override needed here:
      # GitHub forces HOME=/github/home on every step regardless of what's passed
      # via options, which silently broke a prior fix that relied on -e HOME
      # pointing at the Chromium install location — see Dockerfile.node's
      # PLAYWRIGHT_BROWSERS_PATH, which makes the browser location $HOME-independent.
      options: --ipc=host --user root
    defaults:
      run:
        working-directory: /app
        # container: jobs default to sh, not bash, unlike normal runs-on jobs —
        # https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/run-jobs-in-a-container
        # sh (dash) doesn't support `set -o pipefail`, used below.
        shell: bash
    env:
      # playwright.config.ts's webServer.reuseExistingServer reads this to decide
      # whether to always start a fresh server rather than reusing one already
      # on its port (8001 by default — see playwright.config.ts).
      CI: true
      # Path the json reporter writes to — read by summarize-playwright.mjs.
      PLAYWRIGHT_JSON_OUTPUT_NAME: /app/playwright-results.json
    steps:
      - name: Checkout into /app
        if: inputs.should-run
        uses: mjoynes-wombat-web/resume-2026/.github/actions/checkout-to-app@main

      - name: Start timer
        id: timer-start
        if: inputs.should-run
        uses: ./.github/actions/timer-start

      # playwright.config.ts's webServer runs `npm run build && npm run serve`
      # itself, so no separate build step is needed here. test:e2e:coverage's
      # global-teardown.ts (see e2e/global-teardown.ts) throws when coverage
      # drops below threshold, which fails this command's own exit code the
      # same way a failing test does — no separate enforcement step needed.
      - name: Run Playwright e2e tests
        id: run
        if: inputs.should-run
        run: |
          set -o pipefail
          npm run test:e2e:coverage -- --reporter=list,json,html 2>&1 | tee /app/output.log

      - name: Compute duration
        id: timer
        if: always() && inputs.should-run
        uses: ./.github/actions/timer-elapsed
        with:
          start: ${{ steps.timer-start.outputs.start }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            /app/playwright-report/
            /app/test-results/
          retention-days: 7

      # Unlike the report above, deliberately not failure-only — the point is
      # a downloadable coverage report to review/track on every run, pass or
      # fail, same as vitest.yml's equivalent step.
      - name: Upload coverage artifact
        if: always() && inputs.should-run
        uses: actions/upload-artifact@v7
        with:
          name: playwright-coverage
          path: /app/coverage-e2e/
          retention-days: 7

      - name: Summarize output
        id: summarize
        if: always() && inputs.should-run
        run: node .github/scripts/summarize-playwright.mjs

      - name: Write job summary
        if: always() && inputs.should-run
        uses: ./.github/actions/job-summary
        with:
          check-name: Playwright E2E
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          duration: ${{ steps.timer.outputs.duration }}
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}

      # Always comments pass/fail from pr-gate, same convention as vitest.yml;
      # fail-only on a separate merge-queue-labeled thread from merge-queue
      # (no action at all on success) — see .github/actions/pr-comment.
      - name: Comment on PR
        if: always() && inputs.pr-number && inputs.should-run
        uses: ./.github/actions/pr-comment
        with:
          check-name: Playwright E2E
          marker-slug: playwright
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          success-mode: comment
          duration: ${{ steps.timer.outputs.duration }}
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}
