name: Playwright e2e

on:
  workflow_call:
    inputs:
      image:
        description: Testing image ref to run against (from build-image.yml)
        required: true
        type: string
      pr-number:
        description: Pull request number to comment on (omit to skip PR commenting)
        required: false
        type: number
      merge-queue:
        description: Set true when called from merge-queue.yml — uses a separate, merge-queue-labeled comment thread and posts only on failure, instead of always commenting pass/fail
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Chromium needs more than the container default 64MB /dev/shm, or it crashes.
      options: --ipc=host
    defaults:
      run:
        working-directory: /app
    env:
      # playwright.config.ts's webServer.reuseExistingServer reads this to decide
      # whether to always start a fresh server rather than reusing one on :8000.
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/checkout always lands in $GITHUB_WORKSPACE, not /app. Copy the
      # checked-out source into /app, where the image's own npm i already
      # populated node_modules at build time, instead of reinstalling.
      - name: Copy checkout into /app
        run: cp -a "$GITHUB_WORKSPACE"/. /app/

      # playwright.config.ts's webServer runs `npm run build && npm run serve`
      # itself, so no separate build step is needed here.
      - name: Run Playwright e2e tests
        id: run
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /app/output.log

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            /app/playwright-report/
            /app/test-results/
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          if [ "${{ steps.run.outcome }}" = "success" ]; then
            echo "### Playwright e2e: ✅ passed" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Playwright e2e: ❌ failed"
              echo '```'
              tail -n 100 /app/output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # From pr-gate (merge-queue: false): always comments with the current
      # result (pass or fail), updating the same comment on re-runs. If a
      # maintainer manually minimized it, a new update un-minimizes it so the
      # latest result is visible again. (Currently unused in practice, since
      # only merge-queue.yml calls this workflow — kept symmetric with
      # vitest.yml in case that ever changes.)
      #
      # From merge-queue (merge-queue: true): uses a separate marker/thread,
      # labeled accordingly. Only comments on failure — a success takes no
      # action at all, including no cleanup of a prior open failure comment.
      - name: Comment on PR
        if: always() && inputs.pr-number
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const isMergeQueue = ${{ inputs.merge-queue }};
            const marker = isMergeQueue ? '<!-- ci-playwright-mergequeue -->' : '<!-- ci-playwright -->';
            const heading = isMergeQueue ? '### Playwright e2e (merge queue)' : '### Playwright e2e';
            const outcome = '${{ steps.run.outcome }}';
            const { owner, repo } = context.repo;
            const prNumber = ${{ inputs.pr-number }};

            if (isMergeQueue && outcome === 'success') {
              return;
            }

            let body;
            if (outcome === 'success') {
              body = `${marker}\n${heading}\n✅ Passed.`;
            } else {
              const log = fs.readFileSync('/app/output.log', 'utf8').split('\n').slice(-100).join('\n');
              body = `${marker}\n${heading}\n❌ Failed.\n\n<details><summary>Output</summary>\n\n\`\`\`\n${log}\n\`\`\`\n</details>`;
            }

            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: prNumber });
            const existing = comments.data.find((c) => c.body.includes(marker));

            if (existing) {
              try {
                await github.graphql(
                  `mutation($id: ID!) {
                    unminimizeComment(input: { subjectId: $id }) {
                      unminimizedComment { isMinimized }
                    }
                  }`,
                  { id: existing.node_id },
                );
              } catch {
                // wasn't minimized — nothing to undo
              }
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }
