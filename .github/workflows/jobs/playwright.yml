name: Playwright e2e

on:
  workflow_call:
    inputs:
      image:
        description: Testing image ref to run against (from build-image.yml)
        required: true
        type: string
      pr-number:
        description: Pull request number to comment on (omit to skip PR commenting)
        required: false
        type: number
      merge-queue:
        description: Set true when called from merge-queue.yml — uses a separate, merge-queue-labeled comment thread and posts only on failure, instead of always commenting pass/fail
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # Chromium needs more than the container default 64MB /dev/shm, or it crashes.
      options: --ipc=host
    defaults:
      run:
        working-directory: /app
    env:
      # playwright.config.ts's webServer.reuseExistingServer reads this to decide
      # whether to always start a fresh server rather than reusing one on :8000.
      CI: true
    steps:
      - name: Checkout into /app
        uses: ./.github/actions/checkout-to-app

      # playwright.config.ts's webServer runs `npm run build && npm run serve`
      # itself, so no separate build step is needed here.
      - name: Run Playwright e2e tests
        id: run
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /app/output.log

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            /app/playwright-report/
            /app/test-results/
          retention-days: 7

      - name: Write job summary
        if: always()
        uses: ./.github/actions/job-summary
        with:
          check-name: Playwright e2e
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log

      # Always comments pass/fail from pr-gate (currently unused in practice,
      # since only merge-queue.yml calls this workflow — kept symmetric with
      # vitest.yml in case that changes); fail-only on a separate
      # merge-queue-labeled thread from merge-queue (no action at all on
      # success) — see .github/actions/pr-comment.
      - name: Comment on PR
        if: always() && inputs.pr-number
        uses: ./.github/actions/pr-comment
        with:
          check-name: Playwright e2e
          marker-slug: playwright
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          success-mode: comment
