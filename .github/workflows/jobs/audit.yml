name: Dependency audit

on:
  workflow_call:
    inputs:
      image:
        description: Testing image ref to run against (from build-image.yml)
        required: true
        type: string
      pr-number:
        description: Pull request number to comment on
        required: true
        type: number

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: /app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/checkout always lands in $GITHUB_WORKSPACE, not /app. Copy the
      # checked-out source into /app, where the image's own npm i already
      # populated node_modules at build time, instead of reinstalling.
      - name: Copy checkout into /app
        run: cp -a "$GITHUB_WORKSPACE"/. /app/

      # Non-blocking: npm audit exits non-zero when it finds vulnerabilities, but
      # this check should only report, never fail the PR gate.
      - name: Run npm audit
        continue-on-error: true
        run: npm audit --json > audit-results.json || true

      - name: Comment audit results on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-audit -->';
            let body;
            try {
              const data = JSON.parse(fs.readFileSync('/app/audit-results.json', 'utf8'));
              const vulns = data.metadata?.vulnerabilities ?? {};
              const total = Object.values(vulns).reduce((a, b) => a + b, 0);
              body = total === 0
                ? `${marker}\n### npm audit\nNo known vulnerabilities found.`
                : `${marker}\n### npm audit\nFound vulnerabilities: ${JSON.stringify(vulns)}\n\nRun \`npm audit\` locally for details. This check is non-blocking.`;
            } catch (error) {
              body = `${marker}\n### npm audit\nCould not parse audit output (${error.message}). This check is non-blocking.`;
            }

            const { owner, repo } = context.repo;
            const prNumber = ${{ inputs.pr-number }};
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: prNumber });
            const existing = comments.data.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }
