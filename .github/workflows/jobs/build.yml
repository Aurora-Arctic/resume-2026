name: Build

on:
  workflow_call:
    inputs:
      image:
        description: Testing image ref to run against (from build-image.yml)
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: /app
    steps:
      - name: Checkout into /app
        uses: ./.github/actions/checkout-to-app

      - name: Run build
        run: npm run build
