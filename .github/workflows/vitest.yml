name: Vitest

on:
  workflow_call:
    inputs:
      image:
        description: Testing image ref to run against (from build-image.yml)
        required: true
        type: string
      pr-number:
        description: Pull request number to comment on (omit to skip PR commenting)
        required: false
        type: string
      merge-queue:
        description: Set true when called from merge-queue.yml — uses a separate, merge-queue-labeled comment thread and posts only on failure, instead of always commenting pass/fail
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  vitest:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user (node, non-root) can't write to the runner's
      # bind-mounted _temp/_runner_file_commands dir, which actions/checkout (and
      # any JS action using core.saveState/setOutput) needs — EACCES otherwise.
      options: --user root -e HOME=/home/node
    defaults:
      run:
        working-directory: /app
        # container: jobs default to sh, not bash, unlike normal runs-on jobs —
        # https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/run-jobs-in-a-container
        # sh (dash) doesn't support `set -o pipefail`, used below.
        shell: bash
    steps:
      - name: Checkout into /app
        uses: mjoynes-wombat-web/resume-2026/.github/actions/checkout-to-app@main

      - name: Run vitest
        id: run
        run: |
          set -o pipefail
          npm test 2>&1 | tee /app/output.log

      - name: Write job summary
        if: always()
        uses: ./.github/actions/job-summary
        with:
          check-name: Vitest
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log

      # Always comments pass/fail from pr-gate; fail-only on a separate
      # merge-queue-labeled thread from merge-queue (no action at all on
      # success) — see .github/actions/pr-comment.
      - name: Comment on PR
        if: always() && inputs.pr-number
        uses: ./.github/actions/pr-comment
        with:
          check-name: Vitest
          marker-slug: vitest
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          success-mode: comment
