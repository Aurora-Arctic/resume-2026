name: Vitest

# Reusable check that runs the Vitest unit/component test suite. Called
# via workflow_call from pr-gate and merge-queue, never triggered directly.
on:
  workflow_call:
    inputs:
      image:
        description: Testing image ref to run against (from build-image.yml)
        required: true
        type: string
      pr-number:
        description: Pull request number to comment on (omit to skip PR commenting)
        required: false
        type: string
      merge-queue:
        description: Set true when called from merge-queue.yml — uses a separate, merge-queue-labeled comment thread and posts only on failure, instead of always commenting pass/fail
        required: false
        type: boolean
        default: false
      should-run:
        description: >-
          Set false to skip the actual vitest run while still completing this job
          under its normal name. pr-gate passes this from its path-filter output
          instead of putting an `if:` on the calling job — a job-level `if:` makes
          GitHub report a differently-named, bare check run ("vitest" instead of
          "vitest / vitest") when skipped, which never satisfies the "vitest / vitest"
          required status check and leaves the PR stuck. Defaults true so merge-queue
          (no path filtering) is unaffected.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: read
  pull-requests: write
  code-quality: write

jobs:
  vitest:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user (node, non-root) can't write to the runner's
      # bind-mounted _temp/_runner_file_commands dir, which actions/checkout (and
      # any JS action using core.saveState/setOutput) needs — EACCES otherwise.
      options: --user root
    defaults:
      run:
        working-directory: /app
        # container: jobs default to sh, not bash, unlike normal runs-on jobs —
        # https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/run-jobs-in-a-container
        # sh (dash) doesn't support `set -o pipefail`, used below.
        shell: bash
    steps:
      - name: Checkout into /app
        if: inputs.should-run
        uses: mjoynes-wombat-web/resume-2026/.github/actions/checkout-to-app@main

      - name: Start timer
        id: timer-start
        if: inputs.should-run
        uses: ./.github/actions/timer-start

      # @vitest/coverage-v8's coverage.thresholds (vitest.config.ts) fails this
      # command itself when coverage drops below 80% — same exit-code path as a
      # failing test, so steps.run.outcome already reflects combined test+coverage
      # pass/fail with no extra workflow logic needed.
      - name: Run vitest
        id: run
        if: inputs.should-run
        run: |
          set -o pipefail
          npm run test:coverage -- --reporter=default --reporter=json --outputFile=/app/vitest-results.json 2>&1 | tee /app/output.log

      - name: Compute duration
        id: timer
        if: always() && inputs.should-run
        uses: ./.github/actions/timer-elapsed
        with:
          start: ${{ steps.timer-start.outputs.start }}

      - name: Summarize output
        id: summarize
        if: always() && inputs.should-run
        run: node .github/scripts/summarize-vitest.mjs

      # Unlike playwright.yml's report upload, this is deliberately not
      # failure-only — the point is a downloadable coverage report to review/
      # track on every run, pass or fail.
      - name: Upload coverage artifact
        if: always() && inputs.should-run
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage
          path: /app/coverage/
          retention-days: 7

      # Feeds GitHub's own native "Restrict code coverage" ruleset rule
      # (additive to the coverage.thresholds enforcement above, not a
      # replacement — see CLAUDE.md). Requires GitHub Code Quality to be
      # enabled for the repo, which itself requires the org to be on GitHub
      # Team or Enterprise Cloud — a no-op on the Free plan.
      - name: Upload coverage report to GitHub
        if: always() && inputs.should-run
        uses: actions/upload-code-coverage@v1
        with:
          file: /app/coverage/cobertura-coverage.xml
          language: JavaScript
          label: vitest

      - name: Write job summary
        if: always() && inputs.should-run
        uses: ./.github/actions/job-summary
        with:
          check-name: Vitest
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          duration: ${{ steps.timer.outputs.duration }}
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}

      # Always comments pass/fail from pr-gate; fail-only on a separate
      # merge-queue-labeled thread from merge-queue (no action at all on
      # success) — see .github/actions/pr-comment.
      - name: Comment on PR
        if: always() && inputs.pr-number && inputs.should-run
        uses: ./.github/actions/pr-comment
        with:
          check-name: Vitest
          marker-slug: vitest
          pr-number: ${{ inputs.pr-number }}
          merge-queue: ${{ inputs.merge-queue }}
          outcome: ${{ steps.run.outcome }}
          log-file: /app/output.log
          success-mode: comment
          duration: ${{ steps.timer.outputs.duration }}
          summary: ${{ steps.summarize.outputs.summary }}
          details: ${{ steps.summarize.outputs.details }}
