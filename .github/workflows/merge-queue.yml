name: Merge Queue

# Requires "Require merge queue" to be enabled in branch protection for `main`
# and `staging` (Settings -> Branches, or each branch's repo ruleset) — that
# setting is what activates merge_group events; this workflow file alone does
# not turn the merge queue itself on. Applies to both branches unconditionally
# since merge_group carries the target branch itself, with no `branches:`
# filter to update here.
on:
  merge_group:

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build-image:
    uses: ./.github/workflows/build-image.yml

  # merge_group events don't carry a plain PR number the way pull_request events
  # do — it's embedded in the merge group's ref instead
  # (refs/heads/gh-readonly-queue/<base>/pr-<number>-<sha>), so pull it out here
  # once for every job below to use for PR commenting.
  pr-number:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.extract.outputs.number }}
    steps:
      - name: Extract PR number from merge group ref
        id: extract
        run: |
          ref="${{ github.event.merge_group.head_ref }}"
          number=$(echo "$ref" | grep -oP 'pr-\K[0-9]+')
          echo "number=$number" >> "$GITHUB_OUTPUT"

  # No real validation happens here — merge_group only exposes a synthetic
  # head ref, not the PR's actual source branch (see gitflow.yml). This job
  # exists purely so the "gitflow / gitflow" required status check (the same
  # repo ruleset requires it for both PR merges and the merge queue) reports
  # success instead of never posting, which would leave a queued merge stuck
  # waiting on a check that can never complete.
  gitflow:
    uses: ./.github/workflows/gitflow.yml
    with:
      should-run: false

  lint:
    needs: [build-image, pr-number]
    uses: ./.github/workflows/lint.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ needs.pr-number.outputs.number }}
      merge-queue: true

  format:
    needs: [build-image, pr-number]
    uses: ./.github/workflows/format.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ needs.pr-number.outputs.number }}
      merge-queue: true

  typecheck:
    needs: [build-image, pr-number]
    uses: ./.github/workflows/typecheck.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ needs.pr-number.outputs.number }}
      merge-queue: true

  vitest:
    needs: [build-image, pr-number]
    uses: ./.github/workflows/vitest.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ needs.pr-number.outputs.number }}
      merge-queue: true

  build:
    needs: build-image
    uses: ./.github/workflows/build.yml
    with:
      image: ${{ needs.build-image.outputs.image }}

  playwright:
    needs: [build-image, pr-number]
    uses: ./.github/workflows/playwright.yml
    with:
      image: ${{ needs.build-image.outputs.image }}
      pr-number: ${{ needs.pr-number.outputs.number }}
      merge-queue: true
