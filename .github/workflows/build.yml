name: Build

# Reusable check that runs the production Gatsby build. Called via
# workflow_call from pr-gate and merge-queue, never triggered directly.
on:
  workflow_call:
    inputs:
      image:
        description: Testing image ref to run against (from build-image.yml)
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image's default user (node, non-root) can't write to the runner's
      # bind-mounted _temp/_runner_file_commands dir, which actions/checkout (and
      # any JS action using core.saveState/setOutput) needs — EACCES otherwise.
      options: --user root
    defaults:
      run:
        working-directory: /app
    steps:
      - name: Checkout into /app
        uses: mjoynes-wombat-web/resume-2026/.github/actions/checkout-to-app@main

      - name: Run build
        run: npm run build
