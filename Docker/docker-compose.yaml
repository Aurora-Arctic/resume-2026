volumes:
  node_modules_development:
  node_modules_devcontainer:
  gatsby_cache_development:
  gatsby_cache_devcontainer:
  gatsby_public_development:
  gatsby_public_devcontainer:

services:
  development:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.node
      target: builder
    image: resume-2026-development
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules_development:/app/node_modules
      - gatsby_cache_development:/app/.cache
      - gatsby_public_development:/gatsby-public
    init: true
    tty: true
    ports:
      - '8000:8000'
    environment:
      NODE_ENV: development
      CONTAINER_CACHE_DIR: /app/.cache
      CONTAINER_PUBLIC_DIR: /gatsby-public
    command: ['npm', 'run', 'develop', '--', '--host', '0.0.0.0']

  devcontainer:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.node
      target: devcontainer
    image: resume-2026-dev
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules_devcontainer:/app/node_modules
      - gatsby_cache_devcontainer:/app/.cache
      - gatsby_public_devcontainer:/gatsby-public
      - ./claude-home:/home/node/.claude:cached
    init: true
    tty: true
    environment:
      NODE_ENV: development
      CONTAINER_CACHE_DIR: /app/.cache
      CONTAINER_PUBLIC_DIR: /gatsby-public
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
      RESUME_CONTACT_KEY: ${RESUME_CONTACT_KEY}
