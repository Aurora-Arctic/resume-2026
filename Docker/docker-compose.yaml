volumes:
  node_modules:
  gatsby_cache_development:
  gatsby_cache_devcontainer:

services:
  development:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.node
      target: builder
    image: resume-2026-development
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules:/app/node_modules
      - gatsby_cache_development:/gatsby-cache
    init: true
    tty: true
    ports:
      - '8000:8000'
    environment:
      NODE_ENV: development
      CONTAINER_CACHE_DIR: /gatsby-cache
    command: ['npm', 'run', 'develop', '--', '--host', '0.0.0.0']

  devcontainer:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.node
      target: devcontainer
    image: resume-2026-dev
    working_dir: /app
    volumes:
      - ..:/app:cached
      - node_modules:/app/node_modules
      - gatsby_cache_devcontainer:/gatsby-cache
      - ./claude-home:/home/node/.claude:cached
    init: true
    tty: true
    environment:
      NODE_ENV: development
      CONTAINER_CACHE_DIR: /gatsby-cache
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
